<svg xmlns="http://www.w3.org/2000/svg" width="130" height="87" viewBox="0 16 130 87">
  <!-- MirchiLime Connect - live truck marker (side view, facing right).
       Reference copy of the icon drawn inline by truckMarkerHtml() in hundred_trucks.html.
       On the map the cab colour below is each truck's own colour and the bed a darker
       shade of it; the whole icon is mirrored with scaleX(-1) when heading west.
       viewBox is tightened to the artwork so the marker centres on the position. -->
<g fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round">
        <rect x="8" y="68" width="12" height="12" rx="4"/>
        <rect x="110" y="68" width="12" height="12" rx="4"/>
        <rect x="15" y="45" width="60" height="30" rx="6"/>
        <rect x="70" y="25" width="45" height="50" rx="10"/>
        <rect x="15" y="65" width="100" height="12" rx="4"/>
        <circle cx="35" cy="80" r="14"/>
        <circle cx="95" cy="80" r="14"/>
      </g>
      <rect x="8" y="68" width="12" height="12" rx="4" fill="#95A5A6"/>
      <rect x="110" y="68" width="12" height="12" rx="4" fill="#95A5A6"/>
      <rect x="15" y="45" width="58" height="32" rx="4" fill="#B4581F"/>
      <rect x="70" y="25" width="45" height="52" rx="10" fill="#E6A800"/>
      <rect x="82" y="32" width="25" height="20" rx="6" fill="#1A252F"/>
      <rect x="82" y="58" width="10" height="4" rx="2" fill="#000" opacity="0.32"/>
      <rect x="108" y="55" width="8" height="10" rx="4" fill="#FFFBE6"/>
      <rect x="13" y="52" width="6" height="12" rx="3" fill="#E74C3C"/>
      <rect x="15" y="66" width="100" height="12" rx="4" fill="#34495E"/>
      <circle cx="35" cy="80" r="14" fill="#1A252F"/><circle cx="35" cy="80" r="6" fill="#BDC3C7"/>
      <circle cx="95" cy="80" r="14" fill="#1A252F"/><circle cx="95" cy="80" r="6" fill="#BDC3C7"/>
</svg>
