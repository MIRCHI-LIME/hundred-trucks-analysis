<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRCHILIME Connect — Live Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ml-theme.css">
  <script>
    (function(){
      var t = localStorage.getItem('ml-credit-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--ml-bg);
      font-family: var(--ml-font-body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background var(--ml-transition-theme);
    }
    a { color: var(--ml-lemon-deep); text-decoration: none; }
    a:hover { color: var(--ml-lemon-deep-hv); }
    .leaflet-container { font-family: var(--ml-font-body); }
    .leaflet-control-zoom a { color: var(--ml-ink) !important; border-color: var(--ml-hairline-2) !important; }

    @keyframes mlpulse {
      0%   { box-shadow: 0 0 0 0 rgba(234,179,8,0.6); }
      70%  { box-shadow: 0 0 0 16px rgba(234,179,8,0); }
      100% { box-shadow: 0 0 0 0 rgba(234,179,8,0); }
    }
    .mldot    { width: 20px; height: 20px; border-radius: 50%; background: var(--ml-lemon); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); animation: mlpulse 2s infinite; }

    /* live truck marker — halo pulses, truck tilts along the direction of travel */
    .truck-mk { position:relative; width:52px; height:34px; display:grid; place-items:center; }
    .truck-mk .halo { position:absolute; width:26px; height:26px; border-radius:50%; background:var(--ml-line-gold); animation:truckHalo 2.1s ease-out infinite; }
    .truck-mk svg { position:relative; display:block; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35)); }
    @keyframes truckHalo { 0%{transform:scale(0.55);opacity:0.45} 70%{transform:scale(1.5);opacity:0} 100%{transform:scale(1.5);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .truck-mk .halo { animation:none; opacity:0.28; } }
    .mlorigin { width: 16px; height: 16px; border-radius: 50%; background: var(--ml-olive); border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.25); }
    .mldest   { width: 18px; height: 18px; border-radius: 50%; background: var(--ml-panel); border: 4px solid var(--ml-ink); box-shadow: 0 2px 5px rgba(0,0,0,0.25); }

    .card {
      width: 100%;
      max-width: 940px;
      border-radius: var(--ml-radius-shell);
      overflow: hidden;
      box-shadow: var(--ml-shell-shadow);
      border: 1px solid var(--ml-hairline-2);
      background: var(--ml-shell);
      display: flex;
      flex-direction: column;
      transition: background var(--ml-transition-theme), border-color var(--ml-transition-theme);
    }
    #map { width: 100%; height: 480px; z-index: 0; flex-shrink: 0; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; padding: 16px 20px;
      background: var(--ml-shell); border-bottom: 1px solid var(--ml-hairline);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--ml-lemon), var(--ml-lemon-2)); display: flex; align-items: center; justify-content: center; }
    .brand-mark span { width: 11px; height: 11px; border-radius: 3px; background: var(--ml-lemon-deep); }
    .brand-name { font-family: var(--ml-font-display); font-weight: 800; font-size: 15px; color: var(--ml-ink); }
    .brand-name b { color: var(--ml-olive); }

    .valid {
      padding: 6px 14px; border-radius: 12px; text-align: right;
      background: var(--ml-bg); border: 1px solid var(--ml-hairline);
    }
    .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ml-muted-2); font-weight: 700; }
    .valid-date { font-family: var(--ml-font-display); font-weight: 700; font-size: 14px; color: var(--ml-ink); }

    .panel {
      background: var(--ml-shell);
      border-top: 1px solid var(--ml-hairline);
      padding: 22px 24px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .label-sm { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ml-muted-2); font-weight: 700; }
    .truckno { font-family: var(--ml-font-display); font-weight: 800; font-size: 30px; color: var(--ml-ink); letter-spacing: 0.01em; }
    .sub { font-size: 14px; color: var(--ml-muted); font-weight: 500; margin-top: 2px; }

    .freshness { display: flex; align-items: center; gap: 8px; background: var(--ml-amber-chip-bg); border: 1px solid var(--ml-amber-chip-bd); padding: 8px 14px; border-radius: 999px; }
    .freshness.fresh { background: var(--ml-olive-tint); border-color: var(--ml-olive); }
    .freshness.fresh .fresh-dot { background: var(--ml-olive) !important; box-shadow: 0 0 0 3px rgba(108,154,62,0.2) !important; }
    .freshness.fresh .fresh-text { color: var(--ml-olive-text) !important; }
    .fresh-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ml-amber); box-shadow: 0 0 0 3px rgba(232,161,60,0.2); }
    .fresh-text { font-weight: 700; font-size: 13px; color: var(--ml-amber-text); }

    .divider { height: 1px; background: var(--ml-hairline); margin: 20px 0; }

    .route { display: flex; align-items: center; gap: 14px; }
    .route-end { flex: 0 0 auto; }
    .route-place { font-weight: 700; font-size: 15px; color: var(--ml-ink); }
    .route-line { flex: 1; position: relative; height: 22px; }
    .route-line .track { position: absolute; top: 50%; left: 0; right: 0; height: 4px; transform: translateY(-50%); border-radius: 3px; background: repeating-linear-gradient(90deg, var(--ml-border) 0 6px, transparent 6px 12px); }
    .route-line .fill  { position: absolute; top: 50%; left: 0; width: 0%; height: 4px; transform: translateY(-50%); border-radius: 3px; background: linear-gradient(90deg, var(--ml-olive), var(--ml-lemon)); transition: width 1s ease; }
    .route-line .knob  { position: absolute; top: 50%; left: 0%; transform: translate(-50%,-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--ml-lemon); border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.25); transition: left 1s ease; }

    .footrow { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 20px; align-items: center; }
    .loc { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 12px; background: var(--ml-bg); border-radius: 16px; padding: 12px 16px; }
    .loc-pin { width: 38px; height: 38px; border-radius: 11px; background: var(--ml-shell); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(58,44,36,0.12); flex-shrink: 0; }
    .loc-pin span { width: 12px; height: 12px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--ml-lemon); }
    .loc-name { font-weight: 700; font-size: 16px; color: var(--ml-ink); }
    .loc-time { font-size: 12px; color: var(--ml-muted-3); }

    .actions { display: flex; gap: 10px; }
    .btn-call { display: flex; align-items: center; gap: 8px; background: var(--ml-olive-tint); color: var(--ml-olive-text); font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: var(--ml-radius-card); cursor: pointer; }
    .btn-call span { width: 8px; height: 8px; border-radius: 50%; background: var(--ml-olive); }
    .btn-wa { display: flex; align-items: center; gap: 8px; background: var(--ml-lemon); color: var(--ml-ink); font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: var(--ml-radius-card); cursor: pointer; box-shadow: 0 8px 18px -8px rgba(242,194,48,0.75); }
    .btn-tolls { display: flex; align-items: center; gap: 8px; background: var(--ml-bg); color: var(--ml-muted); font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: var(--ml-radius-card); cursor: pointer; border: 1.5px solid var(--ml-border); transition: background 0.2s, color 0.2s; }
    .btn-tolls.active { background: var(--ml-ink); color: var(--ml-bg); border-color: var(--ml-ink); }

    .skeleton { background: linear-gradient(90deg, var(--ml-hairline) 25%, var(--ml-hairline-3) 50%, var(--ml-hairline) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; display: inline-block; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .error-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 40px;
    }
    .error-screen .err-code { font-family: var(--ml-font-display); font-size: 80px; font-weight: 800; color: var(--ml-border); }
    .error-screen .err-title { font-size: 20px; font-weight: 700; color: var(--ml-ink); margin-top: 8px; }
    .error-screen .err-sub { font-size: 14px; color: var(--ml-muted-3); margin-top: 8px; max-width: 280px; }

    @media (max-width: 640px) {
      body { padding: 0; }
      .card { max-width: none; border-radius: 0; border: none; box-shadow: none; min-height: 100vh; }
      #map { height: 52vh; }
      .topbar { padding: 12px 16px; }
      .brand-name { font-size: 13px; }
      .valid { padding: 5px 10px; }
      .valid-date { font-size: 12px; }
      .panel { padding: 16px; }
      .truckno { font-size: 22px; }
      .sub { font-size: 13px; }
      .divider { margin: 14px 0; }
      .route-place { font-size: 13px; }
      .footrow { flex-direction: column; gap: 10px; }
      .loc { width: 100%; }
      .actions { width: 100%; gap: 8px; }
      .btn-call, .btn-wa { flex: 1; justify-content: center; font-size: 13px; padding: 12px 10px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="map"></div>

    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span></div>
        <div class="brand-name">MIRCHILIME <b>Connect</b></div>
      </div>
      <div class="valid">
        <div class="label">Link valid till</div>
        <div class="valid-date" id="validDate">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="label-sm">Truck number</div>
          <div class="truckno" id="truckNo">—</div>
          <div class="sub" id="subInfo">Loading...</div>
        </div>
        <div class="freshness" id="freshness">
          <span class="fresh-dot"></span>
          <span class="fresh-text">Loading...</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="route">
        <div class="route-end">
          <div class="label-sm">Origin</div>
          <div class="route-place" id="originCity">—</div>
        </div>
        <div class="route-line">
          <div class="track"></div>
          <div class="fill" id="routeFill"></div>
          <div class="knob" id="routeKnob"></div>
        </div>
        <div class="route-end" style="text-align:right;">
          <div class="label-sm">Destination</div>
          <div class="route-place" id="destCity">—</div>
        </div>
      </div>

      <div class="footrow">
        <div class="loc">
          <div class="loc-pin"><span></span></div>
          <div>
            <div class="label-sm">Current location</div>
            <div class="loc-name" id="locName">—</div>
            <div class="loc-time" id="locTime">—</div>
          </div>
        </div>
        <div class="actions">
          <a class="btn-call" id="callBtn" href="tel:+910000000000"><span></span> Call driver</a>
          <a class="btn-wa" id="waBtn" href="https://wa.me/910000000000" target="_blank" rel="noopener">WhatsApp</a>
          <button class="btn-tolls" id="tollsBtn" onclick="toggleTolls()">🛣 Toll Plazas</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:8081'
      : 'https://hundred-trucks-analysis.onrender.com';

    const EXPIRY   = new Date('2026-09-05');
    const TOKEN    = new URLSearchParams(location.search).get('token') || '';
    const TRUCK_NO = new URLSearchParams(location.search).get('truck') || '';

    // No token — show error inline
    if (!TOKEN && !TRUCK_NO) {
      document.querySelector('.panel').style.display = 'none';
      document.querySelector('.topbar').style.display = 'none';
      document.getElementById('map').innerHTML = `
        <div class="error-screen">
          <div class="err-code">404</div>
          <div class="err-title">Link not found</div>
          <div class="err-sub">This tracking link is invalid or has expired. Contact your logistics provider for a valid link.</div>
        </div>`;
      return;
    }

    // Leaflet map
    const map = window._map = L.map('map', { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap · © CARTO', maxZoom: 19
    }).addTo(map);

    function icon(cls, size) {
      return L.divIcon({ className: '', html: '<div class="' + cls + '"></div>', iconSize: [size, size], iconAnchor: [size/2, size/2] });
    }

    function istDate(dt) {
      return new Date(dt.replace(' ', 'T') + '+05:30');
    }

    // ── Live truck marker (mirrors truckMarkerHtml in hundred_trucks.html) ──
    // Compass bearing, 0 = north.
    function bearingDeg(from, to) {
      if (!from || !to) return null;
      const dy = to[0] - from[0];
      const dx = (to[1] - from[1]) * Math.cos(to[0] * Math.PI / 180);
      if (!dx && !dy) return null;
      return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
    }
    // Nose follows the heading. Westward headings are mirrored rather than rotated past
    // upside down, and the tilt is capped so the truck never stands on end.
    const MAX_TILT = 65;
    function headingTransform(heading) {
      if (heading == null) return '';
      const th = heading * Math.PI / 180;
      const phi = Math.atan2(-Math.cos(th), Math.sin(th)) * 180 / Math.PI;
      const tilt = v => Math.max(-MAX_TILT, Math.min(MAX_TILT, v)).toFixed(1);
      if (Math.abs(phi) <= 90) return `rotate(${tilt(phi)}deg)`;
      let r = 180 - phi;
      if (r > 180) r -= 360;
      if (r < -180) r += 360;
      return `scaleX(-1) rotate(${tilt(r)}deg)`;
    }
    // One truck per page, so the container takes a fixed blue against the MirchiLime
    // yellow tractor rather than a per-truck colour.
    function truckMarkerHtml(heading) {
      return `<div class="truck-mk">
        <span class="halo"></span>
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="27" viewBox="-6 10 178 99"
             style="transform:${headingTransform(heading)};">
          <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round">
            <rect x="4" y="74" width="12" height="14" rx="4"/>
            <rect x="150" y="74" width="12" height="14" rx="4"/>
            <rect x="10" y="20" width="92" height="59" rx="4"/>
            <rect x="110" y="32" width="42" height="47" rx="8"/>
            <rect x="110" y="20" width="18" height="16" rx="4"/>
            <rect x="8" y="76" width="144" height="12" rx="4"/>
            <circle cx="30" cy="86" r="13"/><circle cx="62" cy="86" r="13"/>
            <circle cx="110" cy="86" r="13"/><circle cx="140" cy="86" r="13"/>
          </g>
          <rect x="4" y="74" width="12" height="14" rx="4" fill="#95A5A6"/>
          <rect x="150" y="74" width="12" height="14" rx="4" fill="#95A5A6"/>
          <rect x="10" y="20" width="92" height="59" rx="4" fill="#2980B9"/>
          <rect x="22" y="20" width="7" height="59" fill="#2471A3"/>
          <rect x="42" y="20" width="7" height="59" fill="#2471A3"/>
          <rect x="62" y="20" width="7" height="59" fill="#2471A3"/>
          <rect x="82" y="20" width="7" height="59" fill="#2471A3"/>
          <rect x="110" y="20" width="18" height="16" rx="4" fill="#E0A800"/>
          <rect x="110" y="32" width="42" height="47" rx="8" fill="#F2C230"/>
          <rect x="122" y="40" width="22" height="20" rx="6" fill="#1A252F"/>
          <rect x="122" y="66" width="12" height="7" rx="3.5" fill="#D35400"/>
          <rect x="142" y="62" width="10" height="12" rx="4" fill="#FFFBE6"/>
          <rect x="8" y="60" width="8" height="14" rx="4" fill="#E74C3C"/>
          <rect x="8" y="76" width="144" height="12" rx="4" fill="#34495E"/>
          <circle cx="30" cy="86" r="13" fill="#1A252F"/><circle cx="30" cy="86" r="6" fill="#BDC3C7"/>
          <circle cx="62" cy="86" r="13" fill="#1A252F"/><circle cx="62" cy="86" r="6" fill="#BDC3C7"/>
          <circle cx="110" cy="86" r="13" fill="#1A252F"/><circle cx="110" cy="86" r="6" fill="#BDC3C7"/>
          <circle cx="140" cy="86" r="13" fill="#1A252F"/><circle cx="140" cy="86" r="6" fill="#BDC3C7"/>
        </svg>
      </div>`;
    }

    // Comparable timestamp — crossings and sim pings can serialize differently
    function tsOf(dt) {
      if (!dt) return 0;
      const s = String(dt);
      const d = istDate(s);
      return isNaN(d) ? (new Date(s).getTime() || 0) : d.getTime();
    }

    function fmtTime(dt) {
      const d = istDate(dt);
      return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', timeZone:'Asia/Kolkata' }) + ', ' +
             d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata', hour12:true });
    }

    function timeAgo(dt) {
      const diff = Math.round((Date.now() - istDate(dt)) / 60000);
      if (diff < 60) return diff + 'm ago';
      if (diff < 1440) return Math.round(diff/60) + 'h ago';
      return Math.round(diff/1440) + 'd ago';
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function _inIndia(lat, lng) { return lat >= 8 && lat <= 37 && lng >= 68 && lng <= 98; }
    async function geocodePin(pincode) {
      if (!pincode) return { city: '', state: '', lat: null, lng: null };
      // try postalpincode.in first
      try {
        const res  = await fetch('https://api.postalpincode.in/pincode/' + pincode);
        const data = await res.json();
        if (data[0]?.Status === 'Success') {
          const p = data[0].PostOffice[0];
          const city = p.District || p.Name || '';
          const lat = parseFloat(p.Latitude), lng = parseFloat(p.Longitude);
          const coords = (lat && lng && _inIndia(lat, lng)) ? { lat, lng } : {};
          if (city) return { city, state: p.State || '', ...coords };
        }
      } catch(e) {}
      // fallback: Nominatim
      try {
        const res  = await fetch(`https://nominatim.openstreetmap.org/search?postalcode=${pincode}&countrycodes=in&format=json&limit=1`);
        const data = await res.json();
        if (data.length > 0) {
          const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
          const parts = data[0].display_name.split(',');
          const city  = parts[1]?.trim() || parts[0]?.trim() || '';
          if (_inIndia(lat, lng)) return { city, state: '', lat, lng };
        }
      } catch(e) {}
      return { city: '', state: '', lat: null, lng: null };
    }

    async function geocodeLatLng(q) {
      try {
        const res  = await fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q + ', India') + '&format=json&limit=1');
        const data = await res.json();
        if (data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      } catch(e) {}
      return null;
    }

    async function load() {
      // Expired check
      if (new Date() > EXPIRY) {
        document.querySelector('.panel').style.display = 'none';
        document.querySelector('.topbar').style.display = 'none';
        document.getElementById('map').innerHTML = `
          <div class="error-screen">
            <div class="err-code" style="font-size:56px">Link Expired</div>
            <div class="err-sub" style="margin-top:12px">This delivery has been completed. The tracking link is no longer active.</div>
          </div>`;
        return;
      }

      // Set valid till
      document.getElementById('validDate').textContent = EXPIRY.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });

      // Fetch crossing data
      let resolvedTruck = TRUCK_NO;
      let crossings = [];
      let ownerName = '';
      let simPings = [], simInfo = null;
      try {
        const url  = TOKEN ? `${API}/api/track?token=${TOKEN}` : `${API}/api/hundred-truck-detail?vehicle_no=${TRUCK_NO}`;
        const res  = await fetch(url);
        const data = await res.json();
        if (data.error) {
          document.querySelector('.panel').style.display = 'none';
          document.getElementById('map').innerHTML = `<div class="error-screen"><div class="err-code">404</div><div class="err-title">Invalid link</div><div class="err-sub">This tracking link is invalid or has expired.</div></div>`;
          return;
        }
        resolvedTruck = data.vehicle_no || TRUCK_NO;
        crossings     = (data.crossings || []).filter(c => c.lat && c.lat !== 0);
        ownerName     = data.truck?.owner || data.truck?.owner_name || '';
        simPings      = (data.sim_pings || []).filter(p => p.lat && p.lat !== 0);
        simInfo       = data.sim || null;
      } catch(e) {}

      // Driver contact — only when the backend supplies a number
      const callBtn = document.getElementById('callBtn');
      const waBtn   = document.getElementById('waBtn');
      if (simInfo?.msisdn) {
        callBtn.href = 'tel:+' + simInfo.msisdn;
        waBtn.href   = 'https://wa.me/' + simInfo.msisdn;
        callBtn.style.display = waBtn.style.display = '';
      } else {
        callBtn.style.display = waBtn.style.display = 'none';
      }

      document.getElementById('truckNo').textContent = resolvedTruck;

      // Fetch trip info
      let pickupCity = '—', dropCity = '—', pickupPin = '', dropPin = '';
      let pickupState = '', dropState = '';
      let shipper = '', tranco = '';
      let pickupGeo = null, dropGeo = null;
      try {
        const res  = await fetch(API + '/api/enroute-trips');
        const data = await res.json();
        const trips = data.result?.data || [];
        const trip  = trips.find(t => t.truck_number.trim() === resolvedTruck.trim());
        if (trip) {
          shipper    = trip.shipper || '';
          tranco     = trip.tranco  || '';
          pickupPin  = trip.pickup_pincode || '';
          dropPin    = trip.drop_pincode   || '';
          const loadingPoint = trip.loading_points?.[0]?.loading_point || '';
          if (trip.pickup_lat && trip.pickup_lng) pickupGeo = { lat: trip.pickup_lat, lng: trip.pickup_lng };
          if (trip.drop_lat   && trip.drop_lng)   dropGeo   = { lat: trip.drop_lat,   lng: trip.drop_lng   };
          // get city from: server cache → pincode geocode → loading_point name
          const [pu, dr] = await Promise.all([geocodePin(pickupPin), geocodePin(dropPin)]);
          pickupCity  = trip.pickup_city || pu.city || loadingPoint || '—';
          dropCity    = trip.drop_city   || dr.city || '—';
          pickupState = pu.state || '';
          dropState   = dr.state || '';
          if (!pickupGeo && pu.lat) pickupGeo = { lat: pu.lat, lng: pu.lng };
          if (!pickupGeo && pu.city) pickupGeo = await geocodeLatLng(pu.city + (pu.state ? ', ' + pu.state : ''));
          if (!pickupGeo && loadingPoint) pickupGeo = await geocodeLatLng(loadingPoint + ', India');
          if (!dropGeo && dr.lat) dropGeo = { lat: dr.lat, lng: dr.lng };
          if (!dropGeo   && dr.city) dropGeo   = await geocodeLatLng(dr.city + (dr.state ? ', ' + dr.state : ''));
        }
      } catch(e) {}

      // Sub line
      const subParts = [];
      if (tranco) subParts.push(tranco);
      if (shipper) subParts.push(shipper + ' Shipment');
      document.getElementById('subInfo').textContent = subParts.join(' · ') || ownerName || resolvedTruck;

      // Origin / destination city labels — prefer pincode city, never show plaza name
      function fmtPlace(city, pin, state) {
        if (city === '—' || !city) return '—';
        let s = city;
        if (pin) s += `(${pin})`;
        if (state) s += `, ${state}`;
        return s;
      }
      if (pickupCity !== '—') {
        document.getElementById('originCity').textContent = fmtPlace(pickupCity, pickupPin, pickupState);
      } else if (crossings.length > 0) {
        document.getElementById('originCity').textContent = 'Near ' + crossings[0].plaza;
      }
      document.getElementById('destCity').textContent = fmtPlace(dropCity, dropPin, dropState);

      // Freshest signal wins — a SIM ping newer than the last toll is the truer position
      const lastCross    = crossings.length ? crossings[crossings.length - 1] : null;
      const lastSim      = simPings.length  ? simPings[simPings.length - 1]   : null;
      const simIsFresher = !!lastSim && (!lastCross || tsOf(lastSim.pinged_at) > tsOf(lastCross.crossed_at));
      const currentCoord = simIsFresher ? [lastSim.lat, lastSim.lng]
                         : lastCross    ? [lastCross.lat, lastCross.lng] : null;

      // Progress bar — measured to the freshest known position
      let progress = 0;
      if (currentCoord && crossings.length > 0 && pickupGeo && dropGeo) {
        const first = crossings[0];
        const totalDist    = haversine(pickupGeo.lat, pickupGeo.lng, dropGeo.lat, dropGeo.lng);
        const traveledDist = haversine(first.lat, first.lng, currentCoord[0], currentCoord[1]);
        const distToFirst  = haversine(pickupGeo.lat, pickupGeo.lng, first.lat, first.lng);
        progress = Math.min(97, Math.round(((distToFirst + traveledDist) / totalDist) * 100));
      } else if (currentCoord) {
        progress = 50;
      }
      document.getElementById('routeFill').style.width = progress + '%';
      document.getElementById('routeKnob').style.left  = progress + '%';

      // Current location & freshness
      if (simIsFresher) {
        document.getElementById('locName').textContent = lastCross ? 'Past ' + lastCross.plaza : 'En route';
        document.getElementById('locTime').textContent = fmtTime(lastSim.pinged_at) + ' · via driver SIM';
        const diffMin = Math.round((Date.now() - istDate(lastSim.pinged_at)) / 60000);
        document.querySelector('.fresh-text').textContent = 'Updated ' + timeAgo(lastSim.pinged_at);
        if (diffMin < 360) {
          document.getElementById('freshness').classList.add('fresh');
        }
      } else if (crossings.length > 0) {
        const last = crossings[crossings.length - 1];
        document.getElementById('locName').textContent = last.plaza;
        const diffMin = Math.round((Date.now() - istDate(last.crossed_at)) / 60000);
        const countText = crossings.length + ' toll' + (crossings.length !== 1 ? 's' : '') + ' crossed';
        document.getElementById('locTime').textContent = fmtTime(last.crossed_at) + ' · ' + countText;

        const ageText = timeAgo(last.crossed_at);
        document.querySelector('.fresh-text').textContent = 'Updated ' + ageText;
        if (diffMin < 360) {
          document.getElementById('freshness').classList.add('fresh');
        }
      } else {
        document.getElementById('locName').textContent = 'No crossing data yet';
        document.getElementById('locTime').textContent = '—';
        document.querySelector('.fresh-text').textContent = 'No data';
      }

      // Store plaza markers for toggle
    window._plazaMarkers = [];
    window._plazasVisible = false;
    crossings.forEach((c, i) => {
      const m = L.circleMarker([c.lat, c.lng], {
        radius: 5, color: '#3A2C24', fillColor: '#fff',
        fillOpacity: 1, weight: 2, opacity: 0.9
      }).bindPopup(`<b>${c.plaza}</b><br><span style="font-size:11px;color:#888;">${fmtTime(c.crossed_at)}</span>`);
      window._plazaMarkers.push(m);
    });

    // Map: draw route — dotted = live SIM lead, solid = route confirmed by toll crossings
      const coords    = crossings.map(c => [c.lat, c.lng]);
      const simCoords = simPings.map(p => [p.lat, p.lng]);

      // SIM first: the solid confirmed route paints over it
      if (simCoords.length > 1) {
        L.polyline(simCoords, {
          color: '#E0A800', weight: 4, opacity: 0.95, dashArray: '2,8', lineCap: 'round'
        }).addTo(map).bindPopup('<b>Live driver location</b><br><span style="font-size:11px;color:#888;">Tracked via driver SIM</span>');
      }
      if (coords.length > 1) {
        var routeLine = L.polyline(coords, { color: '#E0A800', weight: 5, opacity: 0.98, lineJoin: 'round' }).addTo(map);
        L.polylineDecorator(routeLine, {
          patterns: [{
            offset: '10%', repeat: '15%',
            symbol: L.Symbol.arrowHead({
              pixelSize: 10,
              headAngle: 45,
              pathOptions: { color: '#fff', fillOpacity: 1, weight: 0, fillColor: '#fff' }
            })
          }]
        }).addTo(map);
      }

      // Remaining dashed line to drop geo — from wherever the truck actually is now
      if (currentCoord && dropGeo && dropPin) {
        L.polyline([currentCoord, [dropGeo.lat, dropGeo.lng]], {
          color: '#B79A7C', weight: 4, opacity: 0.8, dashArray: '2, 10', lineCap: 'round'
        }).addTo(map);
      }

      // Legend — only worth showing once there are two kinds of line to tell apart
      if (simCoords.length > 1 && coords.length > 1) {
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = () => {
          const d = L.DomUtil.create('div');
          d.style.cssText = 'background:#FBF6EE;padding:8px 11px;border-radius:9px;box-shadow:0 2px 10px rgba(58,44,36,0.18);font-size:11px;font-weight:600;color:#3A2C24;line-height:1.9;';
          d.innerHTML =
            '<div style="display:flex;align-items:center;gap:7px;"><div style="width:22px;height:5px;background:#E0A800;border-radius:3px;"></div> Route confirmed by tolls</div>' +
            '<div style="display:flex;align-items:center;gap:7px;"><div style="width:22px;border-top:4px dotted #E0A800;"></div> Live driver location</div>';
          return d;
        };
        legend.addTo(map);
      }

      // Markers
      const originLatLng = pickupGeo ? [pickupGeo.lat, pickupGeo.lng] : (coords.length > 0 ? coords[0] : null);
      if (originLatLng) {
        const originPopup = pickupCity !== '—'
          ? `<b>📍 Origin</b><br><b>${fmtPlace(pickupCity, pickupPin, pickupState)}</b>`
          : `<b>📍 Origin</b><br>${crossings.length > 0 ? crossings[0].plaza : ''}`;
        L.marker(originLatLng, { icon: icon('mlorigin', 16) }).addTo(map)
          .bindPopup(originPopup);
      }
      if (dropGeo && dropPin) {
        L.marker([dropGeo.lat, dropGeo.lng], { icon: L.divIcon({ className: '', html: '<div class="mldest"></div>', iconSize: [28, 36], iconAnchor: [14, 36] }) }).addTo(map)
          .bindTooltip(fmtPlace(dropCity, dropPin, dropState), { direction: 'top' })
          .bindPopup(`<b>🏁 Destination</b><br><b>${fmtPlace(dropCity, dropPin, dropState)}</b>`, { offset: [0, -30] });
      }
      if (currentCoord) {
        const popup = simIsFresher
          ? `<b>📍 Current Location</b><br>${lastSim.address || (lastCross ? 'Past ' + lastCross.plaza : 'Driver SIM')}<br><span style="color:#888;font-size:11px;">${fmtTime(lastSim.pinged_at)} · via driver SIM</span>`
          : `<b>📍 Current Location</b><br>${lastCross.plaza}<br><span style="color:#888;font-size:11px;">${fmtTime(lastCross.crossed_at)}</span>`;

        // point the truck along the last leg it actually travelled
        let heading = null;
        if (simIsFresher && simPings.length >= 2) {
          const p = simPings[simPings.length - 2];
          heading = bearingDeg([p.lat, p.lng], currentCoord);
        } else if (simIsFresher && lastCross) {
          heading = bearingDeg([lastCross.lat, lastCross.lng], currentCoord);
        } else if (crossings.length >= 2) {
          const p = crossings[crossings.length - 2];
          heading = bearingDeg([p.lat, p.lng], currentCoord);
        }
        if (heading == null && dropGeo) heading = bearingDeg(currentCoord, [dropGeo.lat, dropGeo.lng]);

        L.marker(currentCoord, {
          zIndexOffset: 1000,
          icon: L.divIcon({ className: '', html: truckMarkerHtml(heading), iconAnchor: [26, 17], iconSize: [52, 34] })
        }).addTo(map).bindPopup(popup);
      }

      // Fit bounds
      const allPoints = [...coords, ...simCoords];
      if (dropGeo) allPoints.push([dropGeo.lat, dropGeo.lng]);
      if (allPoints.length > 0) {
        map.fitBounds(L.latLngBounds(allPoints), { padding: [60, 60] });
      } else {
        map.setView([17, 79], 6);
      }
      setTimeout(() => map.invalidateSize(), 200);
    }

    load();
    setInterval(load, 2 * 60 * 60 * 1000);
  })();

  function toggleTolls() {
    const btn = document.getElementById('tollsBtn');
    window._plazasVisible = !window._plazasVisible;
    if (window._plazasVisible) {
      window._plazaMarkers.forEach(m => m.addTo(window._map));
      btn.classList.add('active');
      btn.textContent = '🛣 Hide Plazas';
    } else {
      window._plazaMarkers.forEach(m => m.remove());
      btn.classList.remove('active');
      btn.textContent = '🛣 Toll Plazas';
    }
  }
  </script>
</body>
</html>
